# Servidor MySQL de uso general para prácticas de SQL.
#
#   Iniciar:    docker compose up -d
#   Detener:    docker compose stop
#   Reiniciar desde cero (borra todas las bases y usuarios):
#               docker compose down -v
#
# Conexión desde MySQL Workbench:
#   Hostname: 127.0.0.1 · Port: 3306 · Username: root · Password: root

name: mysql

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: America/Bogota
    ports:
      - "3306:3306"
    # La carpeta del repositorio queda visible dentro del contenedor, en
    # /practicas, y es la carpeta de trabajo. Así, desde la consola de
    # MySQL, un archivo se ejecuta con: SOURCE biblioteca/01_base_datos.sql;
    working_dir: /practicas
    volumes:
      - mysql_datos:/var/lib/mysql
      - ./:/practicas:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_datos:
    name: mysql_datos
